<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Bot | Premium em Breve</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            background-color: #0c0d12;
            color: white;
            font-family: 'Arial', sans-serif;
        }
        .container {
            padding: 40px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #7289da;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #b9bbbe;
        }
        .icon {
            font-size: 5rem;
            color: #f1c40f;
            margin-bottom: 20px;
        }
        .btn-home {
            padding: 12px 25px;
            background-color: #7289da;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-home:hover {
            background-color: #5b6eae;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon"><i class="fa-solid fa-star"></i></div>
        <h1>Premium em Breve</h1>
        <p>Estamos trabalhando em recursos exclusivos para elevar sua experiência.</p>
        <p>Fique ligado para novidades!</p>
        <a href="index.html" class="btn-home">Voltar para o Início</a>
    </div>

</body>
</html>
